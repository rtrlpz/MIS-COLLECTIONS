services:
  postgres:
    image: postgres:15
    container_name: postgres_collections
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Izquierda (Tu PC): 5433 (controlado por tu .env)
      # Derecha (Contenedor): 5432 (Fijo de Postgres)
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Estructura de carpetas local
      - ./data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_collections
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      # Izquierda (Tu PC): 8081 (controlado por tu .env)
      # Derecha (Contenedor): 80 (Fijo de pgAdmin)
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres