<svg width="1200" height="820" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">

  <!-- Background -->
  <rect width="1200" height="820" fill="#FAFAFA"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">MSI_CollectionsDB — System Architecture</text>
  <text x="600" y="58" text-anchor="middle" font-size="12" fill="#666">Data sources, schema relationships, and reporting layer</text>

  <!-- ─────────────────────────────────────────────
       SOURCE SYSTEMS ZONE (left)
  ───────────────────────────────────────────── -->
  <rect x="30" y="80" width="180" height="660" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="120" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#5F5E5A">Source systems</text>

  <!-- WFM box -->
  <rect x="50" y="115" width="140" height="50" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="120" y="137" text-anchor="middle" font-size="11" font-weight="600" fill="#085041">WFM</text>
  <text x="120" y="152" text-anchor="middle" font-size="10" fill="#0F6E56">agent schedules</text>

  <!-- Dialer / POM box -->
  <rect x="50" y="185" width="140" height="50" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="120" y="207" text-anchor="middle" font-size="11" font-weight="600" fill="#3C3489">Dialer (POM)</text>
  <text x="120" y="222" text-anchor="middle" font-size="10" fill="#534AB7">call records, AHT</text>

  <!-- CRM / CACS box -->
  <rect x="50" y="255" width="140" height="50" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="120" y="277" text-anchor="middle" font-size="11" font-weight="600" fill="#633806">CRM (CACS)</text>
  <text x="120" y="292" text-anchor="middle" font-size="10" fill="#854F0B">PTPs, agent notes</text>

  <!-- Core banking box -->
  <rect x="50" y="325" width="140" height="50" rx="6" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
  <text x="120" y="347" text-anchor="middle" font-size="11" font-weight="600" fill="#791F1F">Core banking</text>
  <text x="120" y="362" text-anchor="middle" font-size="10" fill="#A32D2D">accounts, payments</text>

  <!-- HR box -->
  <rect x="50" y="395" width="140" height="50" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="120" y="417" text-anchor="middle" font-size="11" font-weight="600" fill="#27500A">HR System</text>
  <text x="120" y="432" text-anchor="middle" font-size="10" fill="#3B6D11">agents, supervisors</text>

  <!-- ETL label -->
  <text x="120" y="480" text-anchor="middle" font-size="10" font-weight="600" fill="#888780">Python ETL</text>
  <text x="120" y="494" text-anchor="middle" font-size="10" fill="#888780">data_to_pg.py</text>

  <!-- ETL arrows from sources to DB -->
  <line x1="190" y1="140" x2="250" y2="260" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="190" y1="210" x2="250" y2="310" stroke="#534AB7" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="190" y1="280" x2="250" y2="380" stroke="#854F0B" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="190" y1="350" x2="250" y2="440" stroke="#A32D2D" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="190" y1="420" x2="250" y2="220" stroke="#3B6D11" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>

  <!-- ─────────────────────────────────────────────
       POSTGRESQL DATABASE ZONE (center)
  ───────────────────────────────────────────── -->
  <rect x="235" y="80" width="620" height="660" rx="12" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="545" y="103" text-anchor="middle" font-size="11" font-weight="700" fill="#185FA5">PostgreSQL — MSI_CollectionsDB</text>

  <!-- ── REFERENCE TABLES (top row) ── -->

  <!-- supervisors table -->
  <rect x="260" y="118" width="150" height="84" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <rect x="260" y="118" width="150" height="22" rx="6" fill="#378ADD"/>
  <rect x="260" y="128" width="150" height="12" fill="#378ADD"/>
  <text x="335" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="white">supervisors</text>
  <text x="270" y="153" font-size="10" fill="#185FA5">PK  supervisor_id</text>
  <text x="270" y="167" font-size="10" fill="#378ADD">     name</text>
  <text x="270" y="181" font-size="10" fill="#378ADD">     team_name, region</text>

  <!-- agents table -->
  <rect x="430" y="118" width="150" height="84" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <rect x="430" y="118" width="150" height="22" rx="6" fill="#378ADD"/>
  <rect x="430" y="128" width="150" height="12" fill="#378ADD"/>
  <text x="505" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="white">agents</text>
  <text x="440" y="153" font-size="10" fill="#185FA5">PK  agent_id</text>
  <text x="440" y="167" font-size="10" fill="#378ADD">     agent_name</text>
  <text x="440" y="181" font-size="10" fill="#185FA5">FK  supervisor_id</text>

  <!-- clients table -->
  <rect x="600" y="118" width="155" height="98" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <rect x="600" y="118" width="155" height="22" rx="6" fill="#378ADD"/>
  <rect x="600" y="128" width="155" height="12" fill="#378ADD"/>
  <text x="677" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="white">clients</text>
  <text x="610" y="153" font-size="10" fill="#185FA5">PK  client_id</text>
  <text x="610" y="167" font-size="10" fill="#378ADD">     name, dob</text>
  <text x="610" y="181" font-size="10" fill="#378ADD">     segment</text>
  <text x="610" y="195" font-size="10" fill="#378ADD">     risk_score</text>

  <!-- products table -->
  <rect x="770" y="118" width="160" height="98" rx="6" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <rect x="770" y="118" width="160" height="22" rx="6" fill="#378ADD"/>
  <rect x="770" y="128" width="160" height="12" fill="#378ADD"/>
  <text x="850" y="133" text-anchor="middle" font-size="11" font-weight="700" fill="white">products</text>
  <text x="780" y="153" font-size="10" fill="#185FA5">PK  product_id</text>
  <text x="780" y="167" font-size="10" fill="#378ADD">     product_name</text>
  <text x="780" y="181" font-size="10" fill="#378ADD">     product_type</text>
  <text x="780" y="195" font-size="10" fill="#378ADD">     interest_rate</text>

  <!-- supervisors → agents FK arrow -->
  <line x1="410" y1="160" x2="430" y2="160" stroke="#185FA5" stroke-width="1" marker-end="url(#arr)"/>
  <text x="420" y="155" text-anchor="middle" font-size="9" fill="#185FA5">1:N</text>

  <!-- ── accounts table (center) ── -->
  <rect x="430" y="265" width="185" height="115" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/>
  <rect x="430" y="265" width="185" height="22" rx="6" fill="#534AB7"/>
  <rect x="430" y="275" width="185" height="12" fill="#534AB7"/>
  <text x="522" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="white">accounts</text>
  <text x="440" y="301" font-size="10" fill="#3C3489">PK  account_id</text>
  <text x="440" y="315" font-size="10" fill="#534AB7">FK  client_id</text>
  <text x="440" y="329" font-size="10" fill="#534AB7">FK  product_id</text>
  <text x="440" y="343" font-size="10" fill="#534AB7">     balance, status</text>
  <text x="440" y="357" font-size="10" fill="#534AB7">     min_payment</text>

  <!-- clients → accounts FK -->
  <line x1="677" y1="216" x2="630" y2="265" stroke="#534AB7" stroke-width="1" marker-end="url(#arr)"/>
  <text x="668" y="248" font-size="9" fill="#534AB7">1:N</text>

  <!-- products → accounts FK -->
  <line x1="810" y1="216" x2="640" y2="288" stroke="#534AB7" stroke-width="1" marker-end="url(#arr)"/>

  <!-- agents → accounts (via interactions) connector line -->
  <line x1="505" y1="202" x2="505" y2="265" stroke="#534AB7" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- ── TRANSACTIONAL TABLES (bottom row) ── -->

  <!-- payment_schedule -->
  <rect x="260" y="455" width="158" height="98" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <rect x="260" y="455" width="158" height="22" rx="6" fill="#993C1D"/>
  <rect x="260" y="465" width="158" height="12" fill="#993C1D"/>
  <text x="339" y="470" text-anchor="middle" font-size="10" font-weight="700" fill="white">payment_schedule</text>
  <text x="270" y="491" font-size="10" fill="#712B13">PK  schedule_id</text>
  <text x="270" y="505" font-size="10" fill="#993C1D">FK  account_id</text>
  <text x="270" y="519" font-size="10" fill="#993C1D">     due_date</text>
  <text x="270" y="533" font-size="10" fill="#993C1D">     expected_amount</text>

  <!-- dialer_interactions -->
  <rect x="435" y="455" width="168" height="112" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <rect x="435" y="455" width="168" height="22" rx="6" fill="#534AB7"/>
  <rect x="435" y="465" width="168" height="12" fill="#534AB7"/>
  <text x="519" y="470" text-anchor="middle" font-size="10" font-weight="700" fill="white">dialer_interactions</text>
  <text x="445" y="491" font-size="10" fill="#3C3489">PK  interaction_id</text>
  <text x="445" y="505" font-size="10" fill="#534AB7">FK  agent_id</text>
  <text x="445" y="519" font-size="10" fill="#534AB7">FK  account_id</text>
  <text x="445" y="533" font-size="10" fill="#534AB7">     rpc_flag, date</text>
  <text x="445" y="547" font-size="10" fill="#534AB7">     aht_seconds, acw</text>

  <!-- ptp_log -->
  <rect x="620" y="455" width="152" height="112" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <rect x="620" y="455" width="152" height="22" rx="6" fill="#854F0B"/>
  <rect x="620" y="465" width="152" height="12" fill="#854F0B"/>
  <text x="696" y="470" text-anchor="middle" font-size="10" font-weight="700" fill="white">ptp_log</text>
  <text x="630" y="491" font-size="10" fill="#633806">PK  ptp_id</text>
  <text x="630" y="505" font-size="10" fill="#854F0B">FK  agent_id</text>
  <text x="630" y="519" font-size="10" fill="#854F0B">FK  account_id</text>
  <text x="630" y="533" font-size="10" fill="#854F0B">     amount_promised</text>
  <text x="630" y="547" font-size="10" fill="#854F0B">     status</text>

  <!-- cures_log -->
  <rect x="788" y="455" width="152" height="98" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <rect x="788" y="455" width="152" height="22" rx="6" fill="#3B6D11"/>
  <rect x="788" y="465" width="152" height="12" fill="#3B6D11"/>
  <text x="864" y="470" text-anchor="middle" font-size="10" font-weight="700" fill="white">cures_log</text>
  <text x="798" y="491" font-size="10" fill="#27500A">PK  cure_id</text>
  <text x="798" y="505" font-size="10" fill="#3B6D11">FK  agent_id</text>
  <text x="798" y="519" font-size="10" fill="#3B6D11">FK  account_id</text>
  <text x="798" y="533" font-size="10" fill="#3B6D11">     amount_paid</text>

  <!-- agent_time_log -->
  <rect x="260" y="580" width="175" height="112" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <rect x="260" y="580" width="175" height="22" rx="6" fill="#0F6E56"/>
  <rect x="260" y="590" width="175" height="12" fill="#0F6E56"/>
  <text x="347" y="595" text-anchor="middle" font-size="10" font-weight="700" fill="white">agent_time_log</text>
  <text x="270" y="616" font-size="10" fill="#085041">PK  time_id</text>
  <text x="270" y="630" font-size="10" fill="#0F6E56">FK  agent_id</text>
  <text x="270" y="644" font-size="10" fill="#0F6E56">     tht_hours</text>
  <text x="270" y="658" font-size="10" fill="#0F6E56">     operational_hours</text>
  <text x="270" y="672" font-size="10" fill="#0F6E56">     utilization</text>

  <!-- FK arrows: accounts → transactional tables -->
  <line x1="450" y1="380" x2="340" y2="455" stroke="#993C1D" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="510" y1="380" x2="510" y2="455" stroke="#534AB7" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="560" y1="380" x2="680" y2="455" stroke="#854F0B" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="580" y1="380" x2="820" y2="455" stroke="#3B6D11" stroke-width="1" marker-end="url(#arr)"/>

  <!-- agents → dialer, ptp, cures, time_log FK arrows -->
  <line x1="505" y1="202" x2="490" y2="455" stroke="#534AB7" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="505" y1="202" x2="660" y2="455" stroke="#854F0B" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="505" y1="202" x2="840" y2="455" stroke="#3B6D11" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="460" y1="202" x2="340" y2="580" stroke="#0F6E56" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>

  <!-- ─────────────────────────────────────────────
       KPI VIEWS ZONE (inside DB zone, bottom)
  ───────────────────────────────────────────── -->
  <rect x="245" y="710" width="595" height="22" rx="6" fill="#185FA5"/>
  <text x="542" y="725" text-anchor="middle" font-size="11" font-weight="700" fill="white">KPI views: v_agent_daily_kpis  |  v_agent_monthly_kpis  |  v_supervisor_monthly  |  v_ptp_performance  |  v_account_delinquency</text>

  <!-- arrow from tables to views -->
  <line x1="542" y1="567" x2="542" y2="710" stroke="#185FA5" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr)"/>

  <!-- ─────────────────────────────────────────────
       REPORTING ZONE (right)
  ───────────────────────────────────────────── -->
  <rect x="890" y="80" width="285" height="660" rx="12" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="1032" y="103" text-anchor="middle" font-size="11" font-weight="600" fill="#5F5E5A">Reporting layer</text>

  <!-- Power BI -->
  <rect x="912" y="115" width="240" height="65" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="1032" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#3C3489">Power BI Desktop</text>
  <text x="1032" y="157" text-anchor="middle" font-size="10" fill="#534AB7">Executive dashboard</text>
  <text x="1032" y="170" text-anchor="middle" font-size="10" fill="#534AB7">agent scorecard  |  team leaderboard</text>

  <!-- Excel -->
  <rect x="912" y="200" width="240" height="55" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="1032" y="223" text-anchor="middle" font-size="12" font-weight="700" fill="#27500A">Excel (Power Query)</text>
  <text x="1032" y="240" text-anchor="middle" font-size="10" fill="#3B6D11">Daily MIS report template</text>

  <!-- SQL client -->
  <rect x="912" y="275" width="240" height="55" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="1032" y="298" text-anchor="middle" font-size="12" font-weight="700" fill="#712B13">SQL client (pgAdmin / DBeaver)</text>
  <text x="1032" y="314" text-anchor="middle" font-size="10" fill="#993C1D">Ad-hoc analysis, EDA queries</text>

  <!-- arrows from views to reporting tools -->
  <line x1="855" y1="721" x2="912" y2="147" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="855" y1="721" x2="912" y2="227" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="855" y1="721" x2="912" y2="302" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Docker note -->
  <rect x="912" y="360" width="240" height="44" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="1032" y="379" text-anchor="middle" font-size="11" font-weight="600" fill="#444441">Docker</text>
  <text x="1032" y="394" text-anchor="middle" font-size="10" fill="#5F5E5A">Postgres runs in container locally</text>

  <!-- ─────────────────────────────────────────────
       LEGEND
  ───────────────────────────────────────────── -->
  <rect x="30" y="758" width="840" height="48" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="1"/>
  <text x="45" y="775" font-size="10" font-weight="700" fill="#444441">Legend:</text>

  <rect x="100" y="764" width="12" height="12" rx="2" fill="#378ADD"/>
  <text x="118" y="775" font-size="10" fill="#444441">Reference / lookup tables</text>

  <rect x="270" y="764" width="12" height="12" rx="2" fill="#534AB7"/>
  <text x="288" y="775" font-size="10" fill="#444441">Core transactional tables</text>

  <rect x="440" y="764" width="12" height="12" rx="2" fill="#3B6D11"/>
  <text x="458" y="775" font-size="10" fill="#444441">Cure / recovery events</text>

  <line x1="600" y1="770" x2="630" y2="770" stroke="#888780" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <text x="638" y="775" font-size="10" fill="#444441">ETL ingestion</text>

  <line x1="720" y1="770" x2="750" y2="770" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="758" y="775" font-size="10" fill="#444441">FK relationship</text>

  <!-- PK/FK label row -->
  <text x="45" y="795" font-size="10" fill="#5F5E5A">PK = Primary key    FK = Foreign key    All tables in public schema — in production: collections.{table_name}</text>

  <!-- Arrow marker def -->
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

</svg>
